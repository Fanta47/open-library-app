<div class="book-details-container">
  <button (click)="goBack()" class="back-btn">← Retour</button>

  <div *ngIf="isLoading" class="loading">
    ⏳ Chargement en cours...
  </div>

  <div *ngIf="errorMessage" class="error">
    ⚠️ {{ errorMessage }}
  </div>

  <div *ngIf="book && !isLoading" class="book-details">
    <div class="book-image">
      <img 
        [src]="getCoverUrl(book.covers?.[0])" 
        [alt]="book.title"
      />
    </div>
    
    <div class="book-content">
      <h1>{{ book.title }}</h1>
      
      <p *ngIf="book.subtitle" class="subtitle">{{ book.subtitle }}</p>
      
      <div class="metadata">
        <p *ngIf="book.first_publish_year">
          <strong>📅 Année de publication:</strong> {{ book.first_publish_year }}
        </p>
        <p *ngIf="book.number_of_pages">
          <strong>📖 Pages:</strong> {{ book.number_of_pages }}
        </p>
        <p *ngIf="book.key">
          <strong>🔑 ID:</strong> {{ book.key }}
        </p>
      </div>

      <div *ngIf="book.description" class="description">
        <h3>Description</h3>
        <p>{{ book.description }}</p>
      </div>

      <div *ngIf="book.authors && book.authors.length > 0" class="authors">
        <h3>Auteurs</h3>
        <ul>
          <li *ngFor="let author of book.authors">
            {{ author.name }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
